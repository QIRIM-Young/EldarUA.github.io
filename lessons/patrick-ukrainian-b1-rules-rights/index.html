function attempted(){return BASE.filter(i=>state.answers['base:'+i.id]?.first!==undefined&&state.answers['base:'+i.id]?.first!==null).length}
function firstCorrect(){return BASE.filter(i=>{let a=state.answers['base:'+i.id];return a&&a.first!==null&&a.first!==undefined&&a.first===correctValue(i)}).length}
function correctValue(item){return item.type==='order'?item.tiles.map((_,i)=>i).join(','):item.key}
function firstMissSkills(){const result=[];for (let i of BASE){let a=state.answers['base:'+i.id];if(a&&a.first!==null&&a.first!==undefined&&a.first!==correctValue(i))result.push(i.skill)}return [...new Set(result)]}
function keyTitle(id){return DATA.sections.find(x=>x.id===id)?.[lang]||id}
function pct(){return Math.round(BASE.filter(i=>state.answers['base:'+i.id]?.correct).length/total*100)}
function completedCount(){return BASE.filter(i=>state.answers['base:'+i.id]?.correct).length}
function button(label,fn,variant=''){return `<button class="btn ${variant}" type="button" data-action="${escape(fn)}">${escape(label)}</button>`}
function maybeReset(){if(confirm(tr('restartConfirm'))){const keep=lang;state=initial();lang=keep;save();render();scrollTop()}}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}
function setLang(l){lang=l;save();render()}
function setPhase(p){state.started=true;state.phase=p;save();render();scrollTop()}
function start(){state.started=true;state.phase='theory';save();render();scrollTop()}
function resume(){if(!state.started)return start();if(state.phase==='welcome')state.phase=state._resume&&state._resume!=='welcome'?state._resume:'theory';if(state.phase==='results'&&!baseDone())state.phase='base';save();render();scrollTop()}
function beginPractice(){if(!state.started)state.started=true;state.phase='base';let firstIncomplete=BASE.findIndex(x=>!state.answers['base:'+x.id]?.correct);if(firstIncomplete>=0&&state.index>firstIncomplete)state.index=firstIncomplete;save();render();scrollTop()}
function renderTop(){document.documentElement.lang=lang;$('deButton').setAttribute('aria-pressed',String(lang==='de'));$('enButton').setAttribute('aria-pressed',String(lang==='en'));$('brandname').textContent=tr('lesson');$('branddesc').textContent=lang==='de'?'Selbstständiges Training':'Independent practice';$('introLabel').textContent=tr('intro');$('heroTitle').textContent=tr('hero');$('heroDesc').textContent=tr('subtitle');$('statTypes').textContent=tr('practiceTypes');$('statProgress').textContent=`${completedCount()} / ${total} · ${pct()}%`;$('resetTop').title=tr('reset');$('resetTop').setAttribute('aria-label',tr('reset'));$('footer').textContent=tr('saved')+' · '+tr('return')}
function renderNav(){let p=state.phase;const active=(v)=>p===v;let items=[['welcome','⌂',tr('overview')],['theory','≡',tr('theory')],['base','✦',tr('practice')],['results','◉',tr('results')]];if(state.review)items.splice(3,0,['review','↻',tr('review')]);$('sidebar').innerHTML=`<div class="sidetitle">${escape(tr('mode'))}</div>${items.map(([name,sym,title])=>`<button type="button" class="sideItem" data-nav="${name}" aria-current="${active(name)}"><span class="sideNum">${sym}</span><span>${escape(title)}</span></button>`).join('')}<div class="divider"></div><div class="progressrow"><span>${escape(tr('progress'))}</span><b>${completedCount()} / ${total}</b></div><div class="bar"><span style="width:${pct()}%"></span></div>`}
function mobileNav(){let items=[['welcome',tr('overview')],['theory',tr('theory')],['base',tr('practice')],['results',tr('results')]];if(state.review)items.splice(3,0,['review',tr('review')]);return `<div class="mobileNav"><div class="chiplist" aria-label="Sections">${items.map(([p,l])=>`<button class="chip" data-nav="${p}" aria-pressed="${state.phase===p}">${escape(l)}</button>`).join('')}</div><div class="mini">${escape(tr('desktopHint'))}</div></div>`}
function viewWelcome(){let progress=attempted(),d=baseDone();return `<div class="sheet"><span class="eyebrow">${escape(tr('whatLearn'))}</span><h2>${escape(tr('hero'))}</h2><p>${escape(tr('subtitle'))}</p><div class="metricGrid"><div class="metric"><b>${total}</b><small>${escape(tr('questions'))}</small></div><div class="metric"><b>${progress}</b><small>${escape(tr('firstTry'))}</small></div><div class="metric"><b>${pct()}%</b><small>${escape(tr('progress'))}</small></div></div><div class="bar"><span style="width:${pct()}%"></span></div><div class="note">${escape(tr('reviewIntro'))}</div><div class="btnrow">${button(!state.started?tr('begin'):tr('resumebtn'),!state.started?'start':'resume')}${state.started?button(tr('restart'),'reset','secondary'):''}</div><p class="mini">${escape(tr('return'))}</p></div><div class="sheet"><h3>${escape(tr('theory'))}</h3>${DATA.sections.slice(0,5).map((s,i)=>`<button class="sideItem" style="width:100%;display:flex;text-align:left;min-height:46px;border:1px solid var(--stroke);margin:6px 0;padding:9px;background:#fff;border-radius:10px;gap:12px" data-theory="${i}"><span class="sideNum">${i+1}</span><span>${escape(s[lang])}</span></button>`).join('')}</div>`}
function viewTheory(){let th=DATA.theory[state.theory||0]||DATA.theory[0];return `<div class="sheet"><span class="eyebrow">${escape(tr('theory'))}</span><h2>${escape(labelSec(th.id))}</h2><div class="chiplist" role="group" aria-label="Grammar topics">${DATA.theory.map((s,i)=>`<button type="button" class="chip" data-theory="${i}" aria-pressed="${state.theory===i}">${i+1}. ${escape(labelSec(s.id))}</button>`).join('')}</div><div class="theory">${th[lang]}</div>${th.id==='reading'?`<div class="note">${escape(tr('infoDisclaimer'))}</div>`:''}<div class="btnrow">${state.theory>0?button(tr('prev'),'theoryPrev','secondary'):''}${state.theory<DATA.theory.length-1?button(tr('next'),'theoryNext'):button(tr('begin'),'beginPractice')}</div></div>`}
function baseItemState(i){let v=state.answers['base:'+i.id];return v||{first:null,attempts:[],correct:false,selected:[],shownHint:false}}
function markSpecial(s,item){let result=safeText(s);if(item.skill==='motionLoc')result=result.replace(/\b(в|у) (Карпатах|Карпати)/g,'<span class="prep">$1</span> $2');return result}
function answerOptions(it,a,review){let label=it.type==='bank'?tr('tapBank'):tr('tapChoice');return `<p class="help">${escape(label)}</p><div class="options">${it.options.map((opt,k)=>{let already=a.attempts?.includes(k);let right=k===it.key&&a.correct;let cls=right?' good':already&&k!==it.key?' bad':'';return `<button type="button" class="option${cls}" ${a.correct?'disabled':''} data-pick="${k}" aria-label="${String.fromCharCode(65+k)}: ${escape(opt)}"><span class="letter">${String.fromCharCode(65+k)}</span><span class="uk">${escape(opt)}</span></button>`}).join('')}</div>`}
function getTilePermutation(id,n){let indices=Array.from({length:n},(_,i)=>i);let seed=0;for(const c of id)seed=(seed*33+c.charCodeAt(0))>>>0;for(let i=n-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;let j=seed%(i+1);[indices[i],indices[j]]=[indices[j],indices[i]]}if(indices.every((x,i)=>x===i))indices.reverse();return indices}
function orderOptions(it,a,review){let selected=a.selected||[];let perm=getTilePermutation(it.id,it.tiles.length);return `<p class="help">${escape(tr('tapOrder'))}</p><div class="answerline" aria-label="Your sentence">${selected.length?selected.map(i=>`<span class="tile selected uk">${escape(it.tiles[i])}</span>`).join(''):`<em>${escape(tr('tapOrder'))}</em>`}</div><div class="tiles">${perm.map(i=>`<button type="button" class="tile uk" data-tile="${i}" ${selected.includes(i)||a.correct?'disabled':''}>${escape(it.tiles[i])}</button>`).join('')}</div><div class="btnrow">${button(tr('undo'),'undo','secondary')}${button(tr('clear'),'clear','secondary')}${button(tr('check'),'checkOrder')}</div>`}
function currentItem(){if(state.phase==='review'&&state.review){return MAP[state.review.items[state.review.index]]}return BASE[state.index]}
function currentId(){return state.phase==='review'&&state.review?`r${state.review.round}-p${state.review.index}`:currentItem().id}
function currentAnswer(){let key=state.phase==='review'?`review:${currentId()}`:`base:${currentItem().id}`;return state.answers[key]||{first:null,attempts:[],correct:false,selected:[],shownHint:false}}
function saveCurrentAnswer(a){let key=state.phase==='review'?`review:${currentId()}`:`base:${currentItem().id}`;state.answers[key]=a;save()}
function showQuiz(review=false){const it=currentItem();if(!it){return viewResults()}const a=currentAnswer(),done=a.correct;let i=review?state.review.index:state.index,max=review?state.review.items.length:total;let h=a.shownHint?`<div class="hintpanel">${escape(it.hint[lang])}</div>`:'';let txt=it.type==='order'?orderOptions(it,a,review):answerOptions(it,a,review);let first=(a.first===undefined||a.first===null)?'':a.first;let feedback=a.attempts.length?`<div class="feedback ${a.correct?'':'isbad'}" role="status"><strong>${escape(a.correct?tr('correct'):tr('wrong'))}</strong><p>${escape(it.why[lang])}</p>${a.first!==null&&a.first!==undefined&&a.first!==correctValue(it)?`<p class="mini">${escape(tr('mistakeExplanation'))}</p>`:''}</div>`:'';return `<div class="sheet"><span class="eyebrow">${escape(review?tr('reviewRound')+' '+state.review.round:tr('practice'))}</span><h2>${escape(labelSec(it.sec))}</h2><div class="progressrow"><span>${i+1} / ${max} · ${escape(tr('questions'))}</span><span>${escape(tr('complete'))}: ${review?state.review.items.filter((id,idx)=>state.answers['review:r'+state.review.round+'-p'+idx]?.correct).length:completedCount()} / ${max}</span></div><div class="bar"><span style="width:${Math.round((i+1)/max*100)}%"></span></div><div class="questioncard" style="margin-top:18px"><div class="qnum"><span>${escape(labelSec(it.sec))}</span><span class="reviewtag">${it.type==='order'?(lang==='de'?'Wortfolge':'Word order'):it.type==='bank'?(lang==='de'?'Wortbank':'Word bank'):'A · B · C · D'}</span></div><div class="prompt">${escape(it[lang])}</div><div class="uktext" lang="uk">${markSpecial(it.uk,it)}</div><div class="btnrow" style="margin:4px 0"> <button class="hintbtn" data-action="hint">${escape(a.shownHint?tr('hintHide'):tr('hint'))}</button></div>${h}${txt}${feedback}<div class="btnrow">${(i>0)?button(tr('prev'),'quizPrev','secondary'):''}${button(i===max-1?tr('finish'):tr('next'),'quizNext',done?'':'secondary')}${!done?`<span class="mini">${escape(tr('locked'))}</span>`:''}</div></div><p class="mini" style="margin-top:18px">${escape(tr('saved'))}</p></div>`}
function recordChoice(k){const it=currentItem();if(!it||!it.options)return;let a=currentAnswer();if(a.correct)return;if(a.first===null||a.first===undefined)a.first=k;a.attempts=[...a.attempts,k];a.correct=k===it.key;saveCurrentAnswer(a);render();}
function tileClick(i){let a=currentAnswer();if(a.correct)return;a.selected=a.selected||[];if(!a.selected.includes(i)){a.selected.push(i);saveCurrentAnswer(a);render()}}
function updateOrder(fn){let a=currentAnswer();if(a.correct)return;a.selected=a.selected||[];if(fn==='undo')a.selected.pop();else if(fn==='clear')a.selected=[];saveCurrentAnswer(a);render()}
function checkOrder(){let it=currentItem(),a=currentAnswer();if(!it||it.type!=='order'||a.correct)return;if(!a.selected||a.selected.length!==it.tiles.length){showMessage(tr('tapOrder'));return;}let value=a.selected.join(',');if(a.first===null||a.first===undefined)a.first=value;a.attempts=[...a.attempts,value];a.correct=value===correctValue(it);saveCurrentAnswer(a);render()}
function showMessage(s){const live=$('status');if(live)live.textContent=s}
function quizNext(){let a=currentAnswer();if(!a.correct){showMessage(tr('locked'));return}if(state.phase==='review'){if(state.review.index+1<state.review.items.length)state.review.index++;else{reviewRoundDone();return}}else{if(state.index+1<total)state.index++;else if(baseDone()){state.phase='results'}else{let u=BASE.findIndex(x=>!state.answers['base:'+x.id]?.correct);state.index=Math.max(0,u)}}save();render();scrollTop()}
function quizPrev(){if(state.phase==='review'){state.review.index=Math.max(0,state.review.index-1)}else state.index=Math.max(0,state.index-1);save();render();scrollTop()}
function chooseReviewItem(skill){let pool=[...DATA.remedials.filter(i=>i.skill===skill),...BASE.filter(i=>i.skill===skill)];if(!pool.length){const alt=DATA.alias[skill];pool=ITEM.filter(i=>i.skill===alt)}let usage=state.reviewHistory||{},last=state.lastReviewBySkill||{};pool.sort((a,b)=>(Number(a.id===last[skill])-Number(b.id===last[skill]))||((usage[a.id]||Number(!a.reviewOnly))-(usage[b.id]||Number(!b.reviewOnly)))||Number(!a.reviewOnly)-Number(!b.reviewOnly));const selected=pool[0];usage[selected.id]=(usage[selected.id]||0)+1;state.lastReviewBySkill=last;last[skill]=selected.id;return selected.id;}
function startReview(skills=null){if(!baseDone()){state.phase='base';let p=BASE.findIndex(x=>!state.answers['base:'+x.id]?.correct);state.index=Math.max(0,p);save();render();return}skills=skills||firstMissSkills();skills=[...new Set(skills)];if(!skills.length){state.reviewDone=true;state.phase='results';save();render();return}const round=(state.review?.round||0)+1;let items=skills.map(skill=>chooseReviewItem(skill));state.review={round,skills,items,index:0};state.reviewDone=false;state.phase='review';save();render();scrollTop()}
function reviewRoundDone(){let r=state.review,missed=[];r.items.forEach((id,j)=>{let s=r.skills[j],a=state.answers['review:r'+r.round+'-p'+j];if(!a||a.first!==correctValue(MAP[id]))missed.push(s)});missed=[...new Set(missed)];state.roundHistory.push({round:r.round,total:r.items.length,missed});if(!missed.length){state.reviewDone=true;state.phase='results'}else{state.reviewDone=false;state.phase='results';state.review.pending=missed}save();render();scrollTop()}
function viewResults(){let completed=baseDone(),m=firstMissSkills(),att=attempted(),right=firstCorrect(),score=att?Math.round(right/att*100):0;let pending=state.review?.pending||m;let status=!completed?tr('reportActive'):(state.reviewDone||m.length===0)?tr('reportDone'):tr('reviewNeeded');let skills=(completed&&!state.reviewDone)?`<div><h3>${escape(tr('reviewNeeded'))}</h3>${pending.map(s=>`<span class="reviewSkill">${escape(DATA.sections.find(a=>a.id===MAP[BASE.find(x=>x.skill===s)?.id]?.sec)?.[lang]||s)}</span>`).join('')}</div>`:'';return `<div class="sheet"><span class="eyebrow">${escape(tr('results'))}</span><h2>${escape(tr('scoreHeading'))}</h2><div class="metricGrid"><div class="metric"><b>${att} / ${total}</b><small>${escape(tr('firstTry'))}</small></div><div class="metric"><b>${right} / ${att||0}</b><small>${escape(tr('correct'))}</small></div><div class="metric"><b>${score}%</b><small>${escape(tr('original'))}</small></div></div><div class="progressrow"><span>${escape(tr('complete'))}</span><b>${completedCount()} / ${total}</b></div><div class="bar"><span style="width:${pct()}%"></span></div><div class="note">${escape(status)}. ${escape(tr('mistakeExplanation'))}</div>${completed?`<div>${state.reviewDone?`<h3>${escape(tr('allMastered'))}</h3>`:m.length===0?`<h3>${escape(tr('noMistakes'))}</h3>`:skills}</div>`:`<p>${escape(tr('return'))}</p>`}<div class="btnrow">${!completed?button(tr('continue'),'beginPractice'):!state.reviewDone&&m.length?button(state.review?.pending?tr('continueReview'):tr('review'),'startReview'):''}${button(tr('report'),'copyReport','secondary')}${button(tr('restart'),'reset','warn')}</div>${state.roundHistory.length?`<div class="divider"></div><h3>${escape(tr('review'))}</h3>${state.roundHistory.map(v=>`<p>${escape(tr('reviewRound'))} ${v.round}: ${v.total-v.missed.length} / ${v.total}</p>`).join('')}`:''}</div>`}
function reportText(){const missed=firstMissSkills(),att=attempted(),cr=firstCorrect();let lines=[`Patrick · Ukrainian B1`,`${tr('complete')}: ${completedCount()}/${total}`,`${tr('firstTry')}: ${cr}/${att}`,`Original score: ${att?Math.round(cr/att*100):0}%`,`First-try error skills: ${missed.join(', ')||'none'}`,`Review rounds: ${state.roundHistory.length}`,`Review mastered: ${state.reviewDone||!firstMissSkills().length? 'yes':'not yet'}`,`Last saved: ${new Date(state.savedAt||Date.now()).toLocaleString()}`];return lines.join('\n')}
function copyReport(){let s=reportText();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>showMessage(tr('copied'))).catch(()=>fallbackCopy(s));else fallbackCopy(s)}function fallbackCopy(s){let ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showMessage(tr('copied'))}finally{ta.remove()}}
function gotoNav(x){if(x==='results'){state.phase='results'}else if(x==='base'){state.phase='base';state.started=true}else if(x==='review'&&state.review){state.phase='review'}else if(x==='theory'){state.phase='theory'}else{if(state.phase!=='welcome')state._resume=state.phase;state.phase='welcome'}save();render();scrollTop()}
function render(){renderTop();renderNav();let body=state.phase==='theory'?viewTheory():state.phase==='base'?showQuiz(false):state.phase==='review'&&state.review?showQuiz(true):state.phase==='results'?viewResults():viewWelcome();$('main').innerHTML=mobileNav()+body+'<div class="sr" aria-live="polite" id="status"></div>';}
function act(name){switch(name){case 'reset':maybeReset();break;case 'start':start();break;case 'resume':resume();break;case 'beginPractice':beginPractice();break;case 'theoryNext':state.theory=Math.min(DATA.theory.length-1,state.theory+1);save();render();scrollTop();break;case 'theoryPrev':state.theory=Math.max(0,state.theory-1);save();render();scrollTop();break;case 'hint':{let a=currentAnswer();a.shownHint=!a.shownHint;saveCurrentAnswer(a);render();break;}case 'quizNext':quizNext();break;case 'quizPrev':quizPrev();break;case 'checkOrder':checkOrder();break;case 'undo':updateOrder('undo');break;case 'clear':updateOrder('clear');break;case 'startReview':startReview(state.review?.pending||null);break;case 'copyReport':copyReport();break;}}
document.addEventListener('click',ev=>{let t=ev.target.closest('button');if(!t)return;if(t.dataset.action)return act(t.dataset.action);if(t.dataset.pick!==undefined)return recordChoice(Number(t.dataset.pick));if(t.dataset.tile!==undefined)return tileClick(Number(t.dataset.tile));if(t.dataset.nav)return gotoNav(t.dataset.nav);if(t.dataset.theory!==undefined){state.theory=Number(t.dataset.theory);state.started=true;state.phase='theory';save();render();scrollTop()}});
$('deButton').addEventListener('click',()=>setLang('de'));$('enButton').addEventListener('click',()=>setLang('en'));$('resetTop').addEventListener('click',maybeReset);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});window.addEventListener('pagehide',save);
load();if(state.started){const p=state.phase;state._resume=p;state.phase='welcome'}render();
</script></body></html>
