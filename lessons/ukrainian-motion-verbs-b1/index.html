function results(){let completed=allBaseAttempted(),err=wrongSkills(),first=mainFirstGood(),at=mainAttempted(),ready=allTopicAttempted();let intro=completed?tr('allAnswered'):tr('partial');let maybeReview=completed&&err.length&&!S.reviewDone;

function firstUnanswered(topic){let ls=(modules.find(m=>m.id===topic)||modules[0]).items;let j=ls.findIndex(it=>S.answers[it.id]?.first===undefined);return Math.max(0,j)}
function updateOption(i){let it=currentItem();if(!it||it.kind!=='mc')return;let a=answer(it)||{first:undefined,last:undefined,solved:false,tries:0};if(a.solved)return;if(a.first===undefined)a.first=i;a.last=i;a.tries++;a.solved=correct(it,i);setAnswer(it,a);render()}
function tileAdd(i){let it=currentItem();if(!it||!['order','bank'].includes(it.kind)||answer(it)?.solved)return;let ds=draft(it);if(ds.includes(i))return;if(it.kind==='bank'&&ds.length>=it.key.length)return;setDraft(it,[...ds,i]);render()}

function updateDraft(cmd){let it=currentItem();if(!it||answer(it)?.solved)return;let v=draft(it);setDraft(it,cmd==='clear'?[]:v.slice(0,-1));render()}

function finishReview(){let r=S.review;if(!r)return navigate('results');let un=r.items.filter((x,i)=>S.answers[`review:${r.round}:${i}`]?.first===undefined);if(un.length){jump(r.items.findIndex((x,i)=>S.answers[`review:${r.round}:${i}`]?.first===undefined));return}
 let missed=r.items.filter((x,i)=>!correct(itemById[x.id],S.answers[`review:${r.round}:${i}`].first)).map(x=>x.skill);missed=[...new Set(missed)];S.roundLog.push({round:r.round,total:r.items.length,missed});S.review.pending=missed;S.reviewDone=missed.length===0;store();navigate(missed.length?'reviewIntro':'results')}

async function copyReport(){let txt=report();try{await navigator.clipboard.writeText(txt);alert(tr('copied'))}catch{let x=document.createElement('textarea');x.value=txt;x.style.cssText='position:fixed;left:-100vw;';document.body.append(x);x.select();document.execCommand('copy');x.remove();alert(tr('copied'))}}
function reset(){if(!confirm(tr('resetAsk')))return;try{localStorage.removeItem(LKEY);if(oldKey)localStorage.removeItem(oldKey)}catch{}S=fresh();store();navigate('home')}
function handleAction(act){switch(act){case 'home':navigate('home');break;case 'reset':reset();break;case 'startFirst':navigate('theory',modules[0].id);break;case 'resume':resume();break;case 'startPractice':case 'beginTopic':navigate('quiz',S.topic,firstUnanswered(S.topic));break;case 'backTheory':navigate('theory',S.topic);break;case 'nextModule':{let i=modules.findIndex(m=>m.id===S.topic);if(i+1<modules.length)navigate('theory',modules[i+1].id);else goFinal();break;}case 'firstMissing':navigate('quiz',S.topic,firstUnanswered(S.topic));break;case 'previous':jump(S.index-1);break;case 'next':next();break;case 'results':navigate('results');break;case 'final':goFinal();break;case 'startReview':startReview();break;case 'copyReport':copyReport();break;case 'hint':{let i=currentItem();if(!i)return;let key=ansKey(i);S.hints[key]=!S.hints[key];store();render();break;}case 'undo':updateDraft('undo');break;case 'clear':updateDraft('clear');break;case 'check':checkTiles();break;default:break}}
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.lang){S.locale=t.dataset.lang;store();render();return}if(t.dataset.side){let s=t.dataset.side;if(s==='home')navigate('home');else if(s==='results')navigate('results');else if(s==='final')goFinal();else if(s.startsWith('theory:'))navigate('theory',s.slice(7));return}if(t.dataset.module){navigate('theory',t.dataset.module);return}if(t.dataset.jump!==undefined){jump(Number(t.dataset.jump));return}if(t.dataset.choice!==undefined){updateOption(Number(t.dataset.choice));return}if(t.dataset.tile!==undefined){tileAdd(Number(t.dataset.tile));return}if(t.dataset.remove!==undefined){tileRemove(Number(t.dataset.remove));return}if(t.dataset.action){handleAction(t.dataset.action);return}if(t.id==='resetBtn'){reset();return}});
window.addEventListener('pageshow',()=>{render()});store();render();

</script></body></html>
